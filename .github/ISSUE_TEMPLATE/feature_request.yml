name: 功能建议
description: 提出一个新功能或改进
title: '[Feature] '
labels: ['enhancement']
body:
  - type: textarea
    id: problem
    attributes:
      label: 你想解决什么问题？
      description: 描述你的使用场景与痛点。
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 期望的方案
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
    validations:
      required: false
  - type: dropdown
    id: module
    attributes:
      label: 相关模块
      options:
        - 论文库
        - 教材库
        - 学习通托管
        - 伴学娘 / 角色
        - Gal 工坊 / 存档
        - 学习工具
        - 云盘与同步
        - 创意工坊
        - 代码练习场
        - 界面 / 主题
        - 其他
    validations:
      required: false
