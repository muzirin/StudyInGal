name: Bug 报告
description: 报告一个可复现的问题
title: '[Bug] '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！应用内「开发者模式 → 错误与反馈 → 生成 Issue 草稿」可以自动附带环境信息与堆栈。
  - type: textarea
    id: what-happened
    attributes:
      label: 问题描述
      description: 发生了什么？你期望发生什么？
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开 ...
        2. 点击 ...
        3. 观察到 ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: StudyInGal 版本
      placeholder: v0.1.0
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: 操作系统
      options:
        - Windows
        - macOS
        - Linux
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 错误日志 / 截图
      render: shell
    validations:
      required: false
