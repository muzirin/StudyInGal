name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      draft:
        description: '以草稿形式发布'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  android:
    name: Build Android (APK)
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Build mobile web bundle
        run: npm run build:mobile

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Assemble APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Attach APK to release
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk "StudyInGal-${GITHUB_REF_NAME#v}-android.apk"
          gh release upload "$GITHUB_REF_NAME" "StudyInGal-${GITHUB_REF_NAME#v}-android.apk" --clobber

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: package-android
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    env:
      ELECTRON_RUN_AS_NODE: ''
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: build:win
          - os: macos-latest
            script: build:mac
          - os: ubuntu-latest
            script: build:linux
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      # 三平台并行时，electron-builder 会各自尝试创建 release，可能被拆成多个；
      # 这里先统一创建/复用同一个（已发布）release，避免竞态。
      - name: Ensure release exists
        shell: bash
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "StudyInGal $GITHUB_REF_NAME" --notes "Release $GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & publish
        run: npm run ${{ matrix.script }} -- --publish always
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/*.deb
          if-no-files-found: ignore
          retention-days: 14
