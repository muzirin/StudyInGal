appId: com.muzirin.studyingal
productName: StudyInGal
copyright: Copyright © 2026 muzirin and StudyInGal contributors

directories:
  buildResources: build
  output: release

files:
  - out/**
  - resources/**
  - package.json
  - '!**/*.map'

asarUnpack:
  - resources/**

extraResources:
  - from: resources/assets
    to: assets

win:
  target:
    - target: nsis
      arch: [x64]
  artifactName: ${productName}-${version}-win-${arch}-setup.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: StudyInGal

mac:
  target:
    - target: dmg
      arch: [arm64, x64]
  category: public.app-category.education
  artifactName: ${productName}-${version}-mac-${arch}.${ext}

linux:
  target:
    - AppImage
    - deb
  category: Education
  maintainer: muzirin
  artifactName: ${productName}-${version}-linux-${arch}.${ext}

publish:
  - provider: github
    owner: muzirin
    repo: StudyInGal
    # 直接发布（不是 draft）：draft 模式下，一旦 release 已被发布，
    # 后续平台（或重跑）的 --publish always 会因类型不匹配而跳过上传，
    # 导致同一版本被拆成多个 release。标题与说明由工作流后续统一写入。
    releaseType: release
