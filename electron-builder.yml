appId: com.muzirin.studyingal
productName: StudyInGal
copyright: Copyright © 2026 muzirin and StudyInGal contributors

directories:
  buildResources: build
  output: release

files:
  - out/**
  - resources/**
  - package.json
  - '!**/*.map'

asarUnpack:
  - resources/**

win:
  target:
    - target: nsis
      arch: [x64]
  artifactName: ${productName}-${version}-win-${arch}-setup.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: StudyInGal

mac:
  target:
    - target: dmg
      arch: [arm64, x64]
  category: public.app-category.education
  artifactName: ${productName}-${version}-mac-${arch}.${ext}

linux:
  target:
    - AppImage
    - deb
  category: Education
  maintainer: muzirin
  artifactName: ${productName}-${version}-linux-${arch}.${ext}

publish:
  - provider: github
    owner: muzirin
    repo: StudyInGal
    releaseType: draft
