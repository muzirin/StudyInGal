<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0%" stop-color="#FFD9A0" />
      <stop offset="45%" stop-color="#F79E7C" />
      <stop offset="100%" stop-color="#8E5A86" />
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6B4A46" />
      <stop offset="100%" stop-color="#3A2726" />
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFF3D6" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#FFD08A" stop-opacity="0" />
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)" />
  <circle cx="1180" cy="250" r="88" fill="#FFE7B8" opacity="0.85" />

  <!-- 后墙 -->
  <rect x="0" y="0" width="1600" height="640" fill="#B98A79" opacity="0.35" />
  <!-- 黑板 -->
  <rect x="120" y="180" width="520" height="290" rx="10" fill="#2F4038" />
  <rect x="150" y="212" width="460" height="8" rx="4" fill="#DCE9DF" opacity="0.55" />
  <rect x="150" y="238" width="330" height="8" rx="4" fill="#DCE9DF" opacity="0.4" />
  <rect x="150" y="264" width="390" height="8" rx="4" fill="#DCE9DF" opacity="0.35" />
  <rect x="150" y="300" width="180" height="8" rx="4" fill="#DCE9DF" opacity="0.3" />

  <!-- 窗 -->
  <g>
    <rect x="820" y="120" width="700" height="440" rx="12" fill="#FFE9C4" opacity="0.9" />
    <rect x="820" y="120" width="700" height="440" rx="12" fill="url(#glow)" />
    <g stroke="#7A5147" stroke-width="16" opacity="0.85">
      <line x1="1170" y1="120" x2="1170" y2="560" />
      <line x1="820" y1="340" x2="1520" y2="340" />
      <line x1="995" y1="120" x2="995" y2="560" />
      <line x1="1345" y1="120" x2="1345" y2="560" />
    </g>
    <rect x="820" y="120" width="700" height="440" rx="12" fill="none" stroke="#7A5147" stroke-width="18" />
  </g>

  <!-- 地面 -->
  <rect x="0" y="640" width="1600" height="260" fill="url(#floor)" />
  <!-- 课桌剪影 -->
  <g fill="#4A3431" opacity="0.92">
    <rect x="120" y="700" width="330" height="26" rx="8" />
    <rect x="150" y="726" width="18" height="120" />
    <rect x="396" y="726" width="18" height="120" />
    <rect x="520" y="748" width="330" height="26" rx="8" />
    <rect x="550" y="774" width="18" height="116" />
    <rect x="796" y="774" width="18" height="116" />
    <rect x="920" y="700" width="330" height="26" rx="8" />
    <rect x="950" y="726" width="18" height="120" />
    <rect x="1196" y="726" width="18" height="120" />
    <rect x="1300" y="752" width="300" height="26" rx="8" />
    <rect x="1330" y="778" width="18" height="112" />
    <rect x="1546" y="778" width="18" height="112" />
  </g>

  <!-- 夕阳尘埃 -->
  <g fill="#FFF6DC" opacity="0.55">
    <circle cx="980" cy="300" r="4" />
    <circle cx="1080" cy="420" r="3" />
    <circle cx="1240" cy="250" r="5" />
    <circle cx="1360" cy="380" r="3" />
    <circle cx="1120" cy="200" r="3" />
    <circle cx="1450" cy="300" r="4" />
  </g>
</svg>
