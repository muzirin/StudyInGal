<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0%" stop-color="#E7F3F4" />
      <stop offset="55%" stop-color="#CDE4E6" />
      <stop offset="100%" stop-color="#A9C7CD" />
    </linearGradient>
    <linearGradient id="bench" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8C9BA5" />
      <stop offset="100%" stop-color="#5E6B76" />
    </linearGradient>
    <linearGradient id="liquid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7BE0C8" />
      <stop offset="100%" stop-color="#2FA98F" />
    </linearGradient>
    <linearGradient id="liquid2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFD27A" />
      <stop offset="100%" stop-color="#E08A3C" />
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#wall)" />

  <!-- 墙面瓷砖线 -->
  <g stroke="#B4CFD4" stroke-width="3" opacity="0.7">
    <line x1="0" y1="180" x2="1600" y2="180" />
    <line x1="0" y1="360" x2="1600" y2="360" />
    <line x1="0" y1="540" x2="1600" y2="540" />
    <line x1="400" y1="0" x2="400" y2="700" />
    <line x1="800" y1="0" x2="800" y2="700" />
    <line x1="1200" y1="0" x2="1200" y2="700" />
  </g>

  <!-- 靠墙置物架 -->
  <rect x="60" y="230" width="420" height="60" rx="8" fill="#7C8A95" />
  <rect x="60" y="420" width="420" height="60" rx="8" fill="#7C8A95" />
  <!-- 试剂瓶 -->
  <g>
    <rect x="110" y="160" width="34" height="70" rx="6" fill="#CFE9EE" />
    <rect x="110" y="190" width="34" height="40" rx="6" fill="url(#liquid)" />
    <rect x="170" y="150" width="30" height="80" rx="6" fill="#E4F2F5" />
    <rect x="170" y="186" width="30" height="44" rx="6" fill="url(#liquid2)" />
    <rect x="232" y="166" width="36" height="64" rx="6" fill="#DCEBF0" />
    <rect x="232" y="196" width="36" height="34" rx="6" fill="#7FA9E0" />
    <rect x="300" y="156" width="28" height="74" rx="6" fill="#EAF5F7" />
    <rect x="300" y="190" width="28" height="40" rx="6" fill="#C77BD8" />
  </g>

  <!-- 桌面 -->
  <rect x="0" y="700" width="1600" height="200" fill="url(#bench)" />
  <rect x="0" y="692" width="1600" height="16" fill="#B7C4CC" />

  <!-- 显微镜 -->
  <g>
    <rect x="1050" y="640" width="180" height="24" rx="10" fill="#4E5A64" />
    <rect x="1120" y="470" width="40" height="180" rx="12" fill="#5C6A75" />
    <rect x="1100" y="430" width="110" height="40" rx="14" fill="#6C7A86" />
    <rect x="1150" y="380" width="26" height="60" rx="10" fill="#7E8C98" />
    <circle cx="1163" cy="372" r="16" fill="#9AA8B4" />
    <rect x="1090" y="664" width="100" height="14" rx="6" fill="#3F4A53" />
  </g>

  <!-- 实验台上的烧杯 -->
  <g>
    <path d="M420 700 l0 -120 110 0 0 120 z" fill="#DCEBF0" opacity="0.85" />
    <path d="M430 700 l0 -60 90 0 0 60 z" fill="url(#liquid)" opacity="0.9" />
    <path d="M600 700 l6 -90 26 0 -6 90 z" fill="#E8F4F7" opacity="0.9" />
  </g>

  <!-- 屏幕 -->
  <g>
    <rect x="1240" y="420" width="320" height="220" rx="12" fill="#2B3A44" />
    <rect x="1258" y="438" width="284" height="184" rx="8" fill="#0F2A33" />
    <g stroke="#57D6BC" stroke-width="6" opacity="0.9">
      <polyline points="1276,580 1330,520 1380,556 1430,470 1490,500 1524,452" fill="none" />
    </g>
    <rect x="1380" y="640" width="40" height="60" fill="#33424C" />
    <rect x="1330" y="700" width="140" height="16" rx="6" fill="#33424C" />
  </g>

  <!-- 冷光 -->
  <circle cx="1350" cy="520" r="300" fill="#B8F2E6" opacity="0.14" />
</svg>
