<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0%" stop-color="#0B1030" />
      <stop offset="45%" stop-color="#243066" />
      <stop offset="80%" stop-color="#6B5A96" />
      <stop offset="100%" stop-color="#C98A9B" />
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#221E33" />
      <stop offset="100%" stop-color="#120F1D" />
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)" />

  <!-- 星星 -->
  <g fill="#FFFFFF">
    <circle cx="120" cy="120" r="2.4" opacity="0.9" />
    <circle cx="260" cy="220" r="1.8" opacity="0.7" />
    <circle cx="400" cy="90" r="2.8" opacity="0.95" />
    <circle cx="540" cy="260" r="2" opacity="0.75" />
    <circle cx="700" cy="140" r="3" opacity="0.95" />
    <circle cx="860" cy="240" r="1.7" opacity="0.6" />
    <circle cx="980" cy="110" r="2.5" opacity="0.9" />
    <circle cx="1120" cy="230" r="2" opacity="0.7" />
    <circle cx="1260" cy="130" r="3.2" opacity="0.95" />
    <circle cx="1400" cy="250" r="1.9" opacity="0.7" />
    <circle cx="1520" cy="150" r="2.6" opacity="0.9" />
    <circle cx="330" cy="330" r="1.5" opacity="0.5" />
    <circle cx="640" cy="360" r="1.6" opacity="0.5" />
    <circle cx="1020" cy="340" r="1.7" opacity="0.55" />
    <circle cx="1330" cy="380" r="1.5" opacity="0.5" />
    <circle cx="180" cy="420" r="1.4" opacity="0.45" />
    <circle cx="900" cy="430" r="1.4" opacity="0.45" />
  </g>
  <!-- 月亮 -->
  <circle cx="1290" cy="200" r="70" fill="#F7F1DF" opacity="0.95" />
  <circle cx="1266" cy="186" r="62" fill="#FFFFFF" opacity="0.9" />
  <circle cx="1316" cy="220" r="58" fill="#243066" opacity="0.85" />

  <!-- 远景城市 -->
  <g fill="#171B3A" opacity="0.9">
    <rect x="0" y="520" width="140" height="180" />
    <rect x="150" y="560" width="110" height="140" />
    <rect x="280" y="480" width="90" height="220" />
    <rect x="390" y="540" width="130" height="160" />
    <rect x="540" y="500" width="100" height="200" />
    <rect x="660" y="560" width="120" height="140" />
    <rect x="800" y="470" width="96" height="230" />
    <rect x="910" y="530" width="130" height="170" />
    <rect x="1060" y="500" width="110" height="200" />
    <rect x="1190" y="550" width="140" height="150" />
    <rect x="1350" y="490" width="100" height="210" />
    <rect x="1470" y="540" width="130" height="160" />
  </g>
  <!-- 窗灯 -->
  <g fill="#FFD98A" opacity="0.75">
    <rect x="40" y="560" width="12" height="12" />
    <rect x="72" y="600" width="12" height="12" />
    <rect x="300" y="520" width="12" height="12" />
    <rect x="330" y="580" width="12" height="12" />
    <rect x="820" y="510" width="12" height="12" />
    <rect x="852" y="570" width="12" height="12" />
    <rect x="1080" y="540" width="12" height="12" />
    <rect x="1380" y="530" width="12" height="12" />
  </g>

  <!-- 天台 -->
  <rect x="0" y="700" width="1600" height="200" fill="url(#ground)" />
  <rect x="0" y="694" width="1600" height="14" fill="#3A3350" />
  <!-- 护栏 -->
  <g stroke="#3F3A57" stroke-width="8">
    <line x1="0" y1="470" x2="1600" y2="470" />
    <line x1="0" y1="640" x2="1600" y2="640" />
    <line x1="60" y1="470" x2="60" y2="700" />
    <line x1="200" y1="470" x2="200" y2="700" />
    <line x1="340" y1="470" x2="340" y2="700" />
    <line x1="480" y1="470" x2="480" y2="700" />
    <line x1="620" y1="470" x2="620" y2="700" />
    <line x1="760" y1="470" x2="760" y2="700" />
    <line x1="900" y1="470" x2="900" y2="700" />
    <line x1="1040" y1="470" x2="1040" y2="700" />
    <line x1="1180" y1="470" x2="1180" y2="700" />
    <line x1="1320" y1="470" x2="1320" y2="700" />
    <line x1="1460" y1="470" x2="1460" y2="700" />
  </g>
  <!-- 天台水塔剪影 -->
  <rect x="1200" y="600" width="150" height="100" rx="8" fill="#2A2740" />
  <rect x="1230" y="700" width="18" height="60" fill="#2A2740" />
  <rect x="1300" y="700" width="18" height="60" fill="#2A2740" />
</svg>
