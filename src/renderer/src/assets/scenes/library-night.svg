<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#1B2440" />
      <stop offset="55%" stop-color="#243356" />
      <stop offset="100%" stop-color="#121A2E" />
    </linearGradient>
    <radialGradient id="lamp" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#FFD79A" stop-opacity="0.85" />
      <stop offset="60%" stop-color="#F0A85E" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#F0A85E" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2A2136" />
      <stop offset="100%" stop-color="#15101E" />
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)" />

  <!-- 书架 -->
  <g fill="#3A2C4A">
    <rect x="60" y="120" width="420" height="560" rx="10" />
    <rect x="520" y="90" width="360" height="590" rx="10" />
    <rect x="920" y="140" width="300" height="540" rx="10" />
    <rect x="1260" y="100" width="300" height="580" rx="10" />
  </g>
  <g stroke="#241A33" stroke-width="14">
    <line x1="60" y1="260" x2="480" y2="260" />
    <line x1="60" y1="400" x2="480" y2="400" />
    <line x1="60" y1="540" x2="480" y2="540" />
    <line x1="520" y1="240" x2="880" y2="240" />
    <line x1="520" y1="390" x2="880" y2="390" />
    <line x1="520" y1="540" x2="880" y2="540" />
    <line x1="920" y1="290" x2="1220" y2="290" />
    <line x1="920" y1="440" x2="1220" y2="440" />
    <line x1="1260" y1="250" x2="1560" y2="250" />
    <line x1="1260" y1="410" x2="1560" y2="410" />
    <line x1="1260" y1="560" x2="1560" y2="560" />
  </g>
  <!-- 书脊 -->
  <g opacity="0.85">
    <rect x="90" y="180" width="26" height="80" rx="4" fill="#C86B7A" />
    <rect x="126" y="168" width="22" height="92" rx="4" fill="#6E8FC9" />
    <rect x="158" y="186" width="30" height="74" rx="4" fill="#D8B26A" />
    <rect x="200" y="172" width="24" height="88" rx="4" fill="#7FB6A2" />
    <rect x="240" y="182" width="28" height="78" rx="4" fill="#B983C6" />
    <rect x="560" y="160" width="24" height="80" rx="4" fill="#D08A63" />
    <rect x="596" y="150" width="30" height="90" rx="4" fill="#6E8FC9" />
    <rect x="640" y="168" width="22" height="72" rx="4" fill="#C86B7A" />
    <rect x="676" y="156" width="26" height="84" rx="4" fill="#7FB6A2" />
    <rect x="1300" y="170" width="26" height="80" rx="4" fill="#B983C6" />
    <rect x="1340" y="158" width="24" height="92" rx="4" fill="#D8B26A" />
    <rect x="1378" y="176" width="30" height="74" rx="4" fill="#6E8FC9" />
  </g>

  <!-- 地板 -->
  <rect x="0" y="680" width="1600" height="220" fill="url(#floor)" />

  <!-- 阅读桌 -->
  <rect x="600" y="700" width="420" height="34" rx="10" fill="#4A3A2E" />
  <rect x="640" y="734" width="20" height="140" fill="#3A2C22" />
  <rect x="960" y="734" width="20" height="140" fill="#3A2C22" />
  <!-- 台灯与光晕 -->
  <rect x="880" y="600" width="14" height="104" fill="#5C4A66" />
  <path d="M830 600h116l-24 -46h-68z" fill="#C9A05E" />
  <circle cx="888" cy="660" r="260" fill="url(#lamp)" />
  <!-- 摊开的书 -->
  <path d="M700 700l100 -22 104 22 -104 20z" fill="#E8D5B5" />
  <path d="M700 700l100 -22v42z" fill="#F3E4C9" />

  <!-- 浮尘 -->
  <g fill="#FFE7BB" opacity="0.5">
    <circle cx="820" cy="520" r="3" />
    <circle cx="960" cy="470" r="2.5" />
    <circle cx="700" cy="560" r="2" />
    <circle cx="1040" cy="540" r="3" />
  </g>
</svg>
